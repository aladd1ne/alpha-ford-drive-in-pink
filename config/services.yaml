parameters:
    app.contact_phone: '+216 71 000 000'
    app.solidarity_fund_amount: '%env(int:SOLIDARITY_FUND_AMOUNT)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            int $solidarityFundAmount: '%app.solidarity_fund_amount%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

when@test:
    services:
        # Freeze "now" before the October events so availability rules are deterministic.
        clock:
            class: Symfony\Component\Clock\MockClock
            arguments: ['2026-10-01 08:00:00', 'Africa/Tunis']
