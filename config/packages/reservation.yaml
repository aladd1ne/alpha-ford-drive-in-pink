# Drive in Pink — test drive reservations.
#
# - slots: shared time slots ("start-end").
# - experiences.<slug>.dates: event day => either the end of the last bookable shared
#   slot that day (Everest Ranger: Friday until 16:15, Saturday stops at 14:00, no slot
#   between 12:45 and 14:00), or the day's own list of slots ("start-end").
# - experiences.<slug>.capacity: bookings accepted per date + vehicle + slot.
# - experiences.<slug>.opens_at: optional first day bookings are accepted (before it, a pop-up says so).
# - request_month: month accepted by the "autres jours d'octobre" request form
#   (weekends and request_closed_dates are refused).
parameters:
    app.reservation.timezone: 'Africa/Tunis'

    app.reservation.slots:
        - '09:00-09:30'
        - '09:45-10:15'
        - '10:30-11:00'
        - '11:15-11:45'
        - '12:00-12:30'
        - '14:15-14:45'
        - '15:00-15:30'
        - '15:45-16:15'

    app.reservation.experiences:
        everest-ranger:
            capacity: 1
            dates:
                '2026-10-09': '16:15'
                '2026-10-10': '14:00'
        territory:
            capacity: 3
            dates:
                '2026-10-23':
                    - '09:00-09:30'
                    - '09:30-10:00'
                    - '10:00-10:30'
                    - '10:30-11:00'
                    - '11:00-11:30'
                    - '11:30-12:00'
                    - '13:30-14:00'
                    - '14:00-14:30'
                    - '14:30-15:00'
                    - '15:00-15:30'
                    - '15:30-16:00'
                '2026-10-24':
                    - '09:00-09:30'
                    - '09:30-10:00'
                    - '10:00-10:30'
                    - '10:30-11:00'
                    - '11:00-11:30'
                    - '11:30-12:00'
                    - '12:00-12:30'
                    - '12:30-13:00'
                    - '13:00-13:30'
                    - '13:30-14:00'

    app.reservation.request_month: '2026-10'
    app.reservation.request_closed_dates:
        - '2026-10-15'
