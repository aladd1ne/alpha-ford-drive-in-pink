# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    #csrf_protection: true
    annotations: false
    http_method_override: false
    handle_all_throwables: true

    # Trust the nginx reverse proxy (and ngrok if used) so HTTPS detection,
    # CSRF tokens, and session cookies work correctly behind any proxy.
    trusted_proxies: '127.0.0.1,REMOTE_ADDR'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-port', 'x-forwarded-proto', 'x-forwarded-prefix']

    # Sessions (which hold the CSRF tokens) live in var/ so they survive container
    # restarts, and stay valid for 24h of inactivity instead of PHP's default 24 min —
    # otherwise a form left open too long fails with "Le jeton CSRF est invalide".
    session:
        handler_id: session.handler.native_file
        save_path: '%kernel.project_dir%/var/sessions/%kernel.environment%'
        gc_maxlifetime: 86400
        cookie_secure: auto
        cookie_samesite: lax

    #esi: true
    #fragments: true
    php_errors:
        log: true

    # Appended as ?v=… to asset() URLs so browsers fetch fresh CSS/JS — bump on front changes.
    assets:
        version: '%env(ASSETS_VERSION)%'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
